name: GymPulse tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.8
        env:
          POSTGRES_USER: gymtest
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: gymtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gymtest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://gymtest:test-only-password@localhost:5432/gymtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest
